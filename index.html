<div class="header">

  </div>

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

const clusters = L.markerClusterGroup({
  maxClusterRadius: 60,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    const size = count > 1000 ? 50 : count > 100 ? 42 : 34;
    const color = count > 500 ? '#e67e22' : count > 100 ? '#f39c12' : '#f1c40f';
    return L.divIcon({
      html: `<div style="background:${color};width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${size > 42 ? 13 : 11}px;color:#222;border:2px solid rgba(255,255,255,0.4);box-shadow:0 2px 8px rgba(0,0,0,0.4)">${count}</div>`,
      className: '', iconSize: [size, size], iconAnchor: [size/2, size/2]
    });
  }
});

const colorMap = { low: '#2ecc71', medium: '#f39c12', high: '#e74c3c' };

TRACTS.forEach(t => {
  const color = colorMap[t.tier] || '#aaa';
  const marker = L.circleMarker([t.lat, t.lon], {
    radius: 5, fillColor: color, color: 'rgba(0,0,0,0.3)', weight: 0.5, fillOpacity: 0.85
  });
  marker.bindPopup(
    `<b>Census Tract</b><br>Risk Score: <b>${t.score}%</b><br>Tier: <b style="color:${color}">${t.tier.toUpperCase()}</b>`,
    { maxWidth: 180 }
  );
  clusters.addLayer(marker);
});

map.addLayer(clusters);
